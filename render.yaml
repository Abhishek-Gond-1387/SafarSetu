services:
  # ---------------------------------------------------------------------------
  # 1. SafarSetu FastAPI Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: safarsetu-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_LOADED_TRIPS
        value: "35000" # Optimized for Render Free Tier (512MB RAM) memory budget
      - key: OTD_REALTIME_ENABLED
        value: "true"
      - key: OTD_REALTIME_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. SafarSetu Vite React Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: safarsetu-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router client-side rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: safarsetu-backend
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false

