<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>SafarSetu — Delhi NCR Public Transit Assistant</title>
    <meta
      name="description"
      content="Delhi & NCR multimodal public transit journey planner powered by genuine DTC/DIMTS GTFS schedules and DMRC metro telemetry."
    />

    <!-- Progressive Web App (PWA) Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Color Theme for Browsers, Windows & Mobile Status Bars -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="msapplication-navbutton-color" content="#0284c7" />
    <meta name="msapplication-TileColor" content="#0284c7" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- iOS Safari Standalone Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SafarSetu" />

    <!-- Android / Chrome / Edge App Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="SafarSetu" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
